name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    env:
      PUB_DRY_RUN: ${{ vars.PUB_DRY_RUN }}
      PUB_MODS_ENABLE: ${{ vars.PUB_MODS_ENABLE }}
      PUB_MODRINTH_STAGING: ${{ vars.PUB_MODRINTH_STAGING }}
      PUB_MODRINTH_TOKEN: ${{ secrets.PUB_MODRINTH_TOKEN }}
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name || inputs.tag }}
          files: |
            **/fabric/versions/**/build/libs/*.jar
            **/neoforge/versions/**/build/libs/*.jar
          fail_on_unmatched_files: true

      - name: Publish on Modrinth
        run: ./gradlew publishMods